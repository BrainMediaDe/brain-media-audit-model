# Beispiel-Konfiguration fuer Nginx als Reverse Proxy vor
# bam-core.service (Gunicorn auf 127.0.0.1:5000).
#
# Installation:
#   sudo cp deploy/nginx-bam-core.conf /etc/nginx/sites-available/bam-core
#   sudo ln -s /etc/nginx/sites-available/bam-core /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Domain und TLS-Zertifikatspfade anpassen (siehe DEPLOYMENT.md,
# z. B. mit certbot fuer Let's Encrypt).

server {
    listen 80;
    server_name bam.example.org;

    # Redirect auf HTTPS, sobald Zertifikat vorhanden ist:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

