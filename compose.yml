# Brain-Media Audit Model (BAM) Core
#
#     docker compose up
#
# Dashboard und API: http://localhost:5000

services:
  bam:
    build: .
    image: bam-core:2.0.4
    container_name: bam-core
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # Eigenen Modellstand einhaengen, ohne das Image neu zu bauen.
      # Zeile entfernen, um die im Image enthaltene Fassung zu nutzen.
      - ./bam_database.json:/app/bam_database.json:ro
    restart: unless-stopped
